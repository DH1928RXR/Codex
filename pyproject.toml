[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eor-corpus-compiler"
version = "0.1.0"
description = "Deterministic, provenance-bound intermediate representation and extraction compiler for EOR personal corpora"
requires-python = ">=3.11"
authors = [{name = "EOR"}]
license = {text = "Proprietary"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
